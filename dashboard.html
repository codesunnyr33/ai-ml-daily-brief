<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI/ML Daily Brief</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --panel2: #232d3a;
      --text: #e7ecf1;
      --muted: #9aa7b5;
      --accent: #5b9cff;
      --border: #2c3848;
      --chip: #2a3646;
      --ok: #3ecf8e;
      --warn: #e6b35a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 1.1rem; margin: 0; }
    .sub { color: var(--muted); font-size: 0.8rem; margin: 0.2rem 0 0; }
    .header-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
    .status { font-size: 0.8rem; color: var(--muted); min-width: 8rem; }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.75rem 1.25rem 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--muted);
      padding: 0.55rem 0.9rem;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font: inherit;
    }
    .tab.active {
      color: var(--text);
      background: var(--panel);
      border-color: var(--border);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.85rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .search {
      flex: 1 1 220px;
      min-width: 180px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.7rem;
      font: inherit;
    }
    .search::placeholder { color: var(--muted); }
    select.group {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font: inherit;
    }
    a.btn, button.btn {
      display: inline-block;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    a.btn:hover, button.btn:hover { border-color: var(--accent); }
    button.btn.primary {
      background: #1e3a5f;
      border-color: var(--accent);
    }
    main { padding: 1rem 1.25rem 2.5rem; max-width: 960px; }
    .when { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.85rem; }
    section.card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
    }
    section.card h3 {
      margin: 0 0 0.65rem;
      font-size: 0.95rem;
      color: var(--accent);
    }
    section.card ul { margin: 0; padding-left: 1.1rem; }
    section.card li { margin-bottom: 0.4rem; }
    .mark { background: #3a4d1f; color: #e8f5c8; border-radius: 3px; padding: 0 0.15rem; }
    .group-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .group-head {
      width: 100%;
      text-align: left;
      background: var(--panel2);
      border: none;
      color: var(--text);
      padding: 0.75rem 1rem;
      cursor: pointer;
      font: inherit;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }
    .group-head:hover { filter: brightness(1.05); }
    .group-meta { color: var(--muted); font-size: 0.8rem; }
    .group-body { padding: 0.35rem 0.6rem 0.75rem; display: none; }
    .group-block.open .group-body { display: block; }
    .day-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 0.5rem 0.35rem;
      background: var(--bg);
      overflow: hidden;
    }
    .day-head {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      cursor: pointer;
      font: inherit;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .day-body { display: none; padding: 0 0.85rem 0.85rem; }
    .day-card.open .day-body { display: block; }
    .empty { color: var(--muted); padding: 1.5rem 0; }
    .hint {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      max-width: 42rem;
    }
    .dl-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.35rem 0 0.75rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI/ML Daily Brief</h1>
      <p class="sub">Developments · world response · launches · opportunity markets</p>
    </div>
    <div class="header-actions">
      <span class="status" id="status">Ready</span>
      <button class="btn primary" id="refresh-btn" type="button">Refresh</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-today" type="button" role="tab">Today</button>
    <button class="tab" id="tab-archive" type="button" role="tab">Archive</button>
  </div>

  <div class="toolbar" id="toolbar-today">
    <span class="when" id="when" style="margin:0;flex:1 1 auto"></span>
    <a class="btn" id="dl-md" href="#">Markdown</a>
    <a class="btn" id="dl-json" href="#">JSON</a>
    <a class="btn" id="dl-csv" href="#">CSV</a>
    <a class="btn" id="dl-docx" href="#">Word</a>
    <button class="btn" id="copy-btn" type="button">Copy text</button>
  </div>

  <div class="toolbar hidden" id="toolbar-archive">
    <input class="search" id="search" type="search" placeholder="Quick search (company, model, market…)" />
    <select class="group" id="group-by" aria-label="Group by">
      <option value="day">Group by day</option>
      <option value="week">Group by week</option>
      <option value="month" selected>Group by month</option>
    </select>
    <button class="btn" id="expand-all" type="button">Expand all</button>
    <button class="btn" id="collapse-all" type="button">Collapse all</button>
  </div>

  <main>
    <div id="view-today"></div>
    <div id="view-archive" class="hidden"></div>
    <p class="hint">
      Bookmark this dashboard. Click <strong>Refresh</strong> to pull the live morning feed over the network — no new zip or file save.
      Archive, search, and day/week/month grouping stay in the Archive tab.
    </p>
  </main>

  <script>
    // Embedded snapshot used on first open / if Refresh cannot fetch the sidecar file.
    const EMBEDDED = {"updated_at": "2026-09-19 19:40 PT", "schedule": "Every day at 5:00 AM PT", "briefs": [{"date": "2026-09-19", "generated_at": "2026-09-19 19:33 PT", "sections": [{"title": "Latest AI/ML development and evolution", "bullets": ["OpenAI GPT-6 Astra (~Sep 17, 2026): first OpenAI model rated Critical for cybersecurity under Preparedness Framework; Microsoft Foundry GA same day; Foundry pricing ~$10/$50 per M tokens short context.", "Google Gemini 3.8 Live and 3.8 Live Extended Thinking (Sep 15–16): live voice models in Gemini API, AI Studio, Search Live; Extended Thinking in Gemini Live/Workspace; claimed #1 Speech-to-Speech Quality Index (82.6).", "Gemini 3.8 Flash GA Sep 2; DeepMind Dream-RSI paper on arXiv Sep 14; Gemini 4 still in pre-training (no ship date).", "Shanghai AI Lab Atria Dawn Preview (weights Sep 11): MIT-licensed 744B MoE (~40B active), agentic research/engineering, 256K context, HF + OpenAI-compatible APIs.", "Ant Group Realtime-Venus (arXiv ~Sep 9–12): two 9B full-duplex models (Omni + Audio), Apache-2.0 on Hugging Face; quiet repo release."]}, {"title": "How the world is responding", "bullets": ["Pace the Frontier selloff (Sep 12–15): Amodei slowdown essay; Altman/Musk agreed; Philadelphia Semiconductor Index ~−5–6% on Sep 14; Nvidia ~−3.3%.", "Trump dismissed AI-safety slowdown as a sick conspiracy / China race; Huang opposed slowing; Vance skeptical of labs seeking regulation.", "Capex intact: Anthropic linked to $13.7B six-year compute deal same week; hyperscaler 2026 guidance raised/reaffirmed (Amazon ~$220B, Alphabet $195–205B, Meta $130–145B).", "Rotation into software names priced as AI-disruption targets (Adobe, Autodesk, Intuit, etc.) as markets priced slower capability pace."]}, {"title": "New products launching that use AI/ML", "bullets": ["OpenAI Agents API public beta (Sep 10): managed Codex-style cloud agent harness, sandboxes, subagents; pay tokens/tools only.", "OpenAI GPT-Live-1 in API (Sep 10): full-duplex voice front-end at $0.05/min; Presence for enterprise voice agents.", "GPT-6 Astra rolling to ChatGPT Plus/Pro/Business/Enterprise, API, Azure, Bedrock; Enterprise off by default at launch.", "Google Search Live + Workspace Live powered by Gemini 3.8 Live / Extended Thinking; SynthID audio watermarking.", "Huawei Atlas 960E SuperPoD (Sep 17, HUAWEI CONNECT): NPO SuperPoD up to 4,096 NPUs for ~10T-parameter training/inference."]}, {"title": "Markets where AI/ML is still underused (sell opportunities)", "bullets": ["Construction & built-world SMEs: scheduling, safety, document/BIM copilots for low-digitization field workflows.", "Mid-market manufacturing & maintenance: quality inspection, downtime prediction, maintenance ops agents with clear labor ROI.", "Agriculture / field ops: weather, pest, soil, market intel via WhatsApp/voice/SMS for smartphone-only distribution.", "Insurance claims & underwriting: FNOL triage, coverage check, underwriting packet agents for semi-structured paperwork.", "Healthcare admin: prior-auth evidence assembly and SMB clinical documentation still under-automated.", "Legal / audit / PI ops: mid-market contract triage and matter workflows without enterprise AI budgets.", "Property/facilities & local services: housing ops, transaction coordination, supplier risk for fragmented buyers."]}]}]};

    // Live feed published each morning. Refresh pulls this URL (no new download).
    const FEED_URL = localStorage.getItem('aiml_feed_url') || 'briefs-data.json';
    let DATA = (typeof window.__BRIEFS_DATA__ !== 'undefined' && window.__BRIEFS_DATA__)
      ? window.__BRIEFS_DATA__
      : structuredClone(EMBEDDED);
    let activeTab = "today";

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function highlight(text, q) {
      const safe = escapeHtml(text);
      if (!q) return safe;
      const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      return safe.replace(re, '<span class="mark">$1</span>');
    }

    function briefs() {
      return (DATA.briefs || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    }

    function latest() {
      return briefs()[0] || null;
    }

    function isoWeek(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day + 3);
      const first = new Date(d.getFullYear(), 0, 4);
      const week = 1 + Math.round(((d - first) / 86400000 - 3 + ((first.getDay() + 6) % 7)) / 7);
      return d.getFullYear() + "-W" + String(week).padStart(2, "0");
    }

    function groupKey(b, mode) {
      const date = b.date || "";
      if (mode === "month") return date.slice(0, 7) || "Unknown";
      if (mode === "week") return isoWeek(date);
      return date || "Unknown";
    }

    function groupLabel(key, mode) {
      if (mode === "month") {
        const [y, m] = key.split("-");
        const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return (names[Number(m) - 1] || m) + " " + y;
      }
      if (mode === "week") return "Week " + key;
      return key;
    }

    function matchesQuery(b, q) {
      if (!q) return true;
      const blob = [
        b.date,
        b.generated_at,
        ...(b.sections || []).flatMap(s => [s.title, ...(s.bullets || [])])
      ].join("\n").toLowerCase();
      return blob.includes(q.toLowerCase());
    }

    function downloadLinks(date) {
      return {
        md: date + "/brief.md",
        json: date + "/brief.json",
        csv: date + "/brief.csv",
        docx: date + "/brief.docx",
      };
    }

    function renderSections(sections, q) {
      return (sections || []).map(s => `
        <section class="card">
          <h3>${highlight(s.title || "", q)}</h3>
          <ul>${(s.bullets || []).map(x => `<li>${highlight(x, q)}</li>`).join("")}</ul>
        </section>
      `).join("");
    }

    function renderToday() {
      const b = latest();
      const view = $("view-today");
      if (!b) {
        $("when").textContent = "";
        view.innerHTML = '<p class="empty">No briefs yet. After the 5:00 AM PT run, click Refresh.</p>';
        return;
      }
      const dls = downloadLinks(b.date);
      $("when").textContent = `Latest: ${b.date} · generated ${b.generated_at || "—"} · data updated ${DATA.updated_at || "—"}`;
      $("dl-md").href = dls.md;
      $("dl-json").href = dls.json;
      $("dl-csv").href = dls.csv;
      $("dl-docx").href = dls.docx;
      view.innerHTML = renderSections(b.sections);
    }

    function renderArchive() {
      const q = $("search").value.trim();
      const mode = $("group-by").value;
      const list = briefs().filter(b => matchesQuery(b, q));
      const view = $("view-archive");
      if (!list.length) {
        view.innerHTML = '<p class="empty">No matching briefs.</p>';
        return;
      }
      const groups = new Map();
      list.forEach(b => {
        const k = groupKey(b, mode);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(b);
      });
      const keys = [...groups.keys()].sort().reverse();
      view.innerHTML = keys.map((k, gi) => {
        const items = groups.get(k);
        const open = gi === 0 ? " open" : "";
        return `
          <div class="group-block${open}" data-group="${escapeHtml(k)}">
            <button type="button" class="group-head" data-toggle-group>
              <span>${escapeHtml(groupLabel(k, mode))}</span>
              <span class="group-meta">${items.length} brief${items.length === 1 ? "" : "s"}</span>
            </button>
            <div class="group-body">
              ${items.map((b, di) => {
                const dayOpen = gi === 0 && di === 0 ? " open" : "";
                const dls = downloadLinks(b.date);
                return `
                  <div class="day-card${dayOpen}">
                    <button type="button" class="day-head" data-toggle-day>
                      <span><strong>${highlight(b.date, q)}</strong> · ${escapeHtml(b.generated_at || "")}</span>
                      <span class="group-meta">${(b.sections || []).length} sections</span>
                    </button>
                    <div class="day-body">
                      <div class="dl-row">
                        <a class="btn" href="${dls.md}">Markdown</a>
                        <a class="btn" href="${dls.json}">JSON</a>
                        <a class="btn" href="${dls.csv}">CSV</a>
                        <a class="btn" href="${dls.docx}">Word</a>
                      </div>
                      ${renderSections(b.sections, q)}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");

      view.querySelectorAll("[data-toggle-group]").forEach(btn => {
        btn.addEventListener("click", () => btn.closest(".group-block").classList.toggle("open"));
      });
      view.querySelectorAll("[data-toggle-day]").forEach(btn => {
        btn.addEventListener("click", () => btn.closest(".day-card").classList.toggle("open"));
      });
    }

    function render() {
      if (activeTab === "today") renderToday();
      else renderArchive();
    }

    function setTab(tab) {
      activeTab = tab;
      $("tab-today").classList.toggle("active", tab === "today");
      $("tab-archive").classList.toggle("active", tab === "archive");
      $("toolbar-today").classList.toggle("hidden", tab !== "today");
      $("toolbar-archive").classList.toggle("hidden", tab !== "archive");
      $("view-today").classList.toggle("hidden", tab !== "today");
      $("view-archive").classList.toggle("hidden", tab !== "archive");
      render();
    }

    async function refresh() {
      setStatus("Refreshing…");
      const candidates = [];
      if (FEED_URL && !FEED_URL.includes("PLACEHOLDER")) candidates.push(FEED_URL + (FEED_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
      candidates.push("briefs-data.json?t=" + Date.now());
      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: "no-store", mode: "cors" });
          if (!res.ok) continue;
          const next = await res.json();
          if (next && Array.isArray(next.briefs)) {
            DATA = next;
            setStatus("Updated " + (next.updated_at || "just now"), "ok");
            render();
            return;
          }
        } catch (_) {}
      }
      setStatus("Could not reach live feed — retry after morning publish, or check connection", "warn");
      render();
    }

    $("tab-today").onclick = () => setTab("today");
    $("tab-archive").onclick = () => setTab("archive");
    $("refresh-btn").onclick = () => refresh();
    $("search").addEventListener("input", () => { if (activeTab === "archive") renderArchive(); });
    $("group-by").addEventListener("change", () => { if (activeTab === "archive") renderArchive(); });
    $("expand-all").onclick = () => {
      document.querySelectorAll("#view-archive .group-block, #view-archive .day-card").forEach(el => el.classList.add("open"));
    };
    $("collapse-all").onclick = () => {
      document.querySelectorAll("#view-archive .group-block, #view-archive .day-card").forEach(el => el.classList.remove("open"));
    };
    $("copy-btn").onclick = async () => {
      const b = latest();
      if (!b) return;
      const text = [`AI/ML Daily Brief — ${b.date}`, ""].concat(
        (b.sections || []).flatMap(s => [s.title, ...(s.bullets || []).map(x => "• " + x), ""])
      ).join("\n");
      try {
        await navigator.clipboard.writeText(text);
        $("copy-btn").textContent = "Copied";
        setTimeout(() => { $("copy-btn").textContent = "Copy text"; }, 1200);
      } catch (_) {}
    };

    setTab("today");
    setStatus("Loaded local snapshot · click Refresh after morning sync", "ok");
  </script>
</body>
</html>
